[package]
name = "fdm-gui"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
fdm-batch = { path = "../fdm-batch" }
fdm-bt = { path = "../fdm-bt" }
fdm-cli = { path = "../fdm-cli" }
fdm-core = { path = "../fdm-core" }
fdm-ipc = { path = "../fdm-ipc" }
fdm-media = { path = "../fdm-media" }
fdm-native-host = { path = "../fdm-native-host" }
gpui = { version = "0.2.2", features = ["font-kit", "runtime_shaders"], default-features = false }
qrcode = "0.14"
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
unicode-segmentation = "1.12"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
