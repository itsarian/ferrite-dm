[package]
name = "fdm-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ferrite-dm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
fdm-batch = { path = "../fdm-batch" }
fdm-bt = { path = "../fdm-bt" }
fdm-core = { path = "../fdm-core" }
fdm-hls = { path = "../fdm-hls" }
fdm-http = { path = "../fdm-http" }
fdm-ipc = { path = "../fdm-ipc" }
fdm-media = { path = "../fdm-media" }
fdm-native-host = { path = "../fdm-native-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
aes = "0.8"
cbc = "0.1"
