[package]
name = "fdm-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
hex = "0.4"
libc = "0.2"
md-5 = "0.10"
rusqlite = { version = "0.41", default-features = false, features = ["libsqlite3-sys", "bundled", "backup", "chrono", "serde_json", "uuid", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
xattr = "1"
